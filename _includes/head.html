<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
	
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">


  <!-- Bootstrap core CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/vendor/bootstrap-4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/vendor/font-awesome/4.7.0/css/font-awesome.min.css">
 
  <link href="{{ site.baseurl }}/assets/css/style.css" rel="stylesheet">

  <!-- <link href="{{ site.baseurl }}/assets/vendor/bootstrap-4.5.2/css/bootstrap.css" rel="stylesheet" /> -->
  <link href="{{ site.baseurl }}/assets/css/main.css" rel="stylesheet" />
  
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

<style>
  .blog-main {
    background-color: white;
  }
</style>
</head>
